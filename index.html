<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Randi Drehrad/ Chooser</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Hilfsklasse zum Verstecken von Bildschirmen */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 1. HOME SCREEN (HAUPTMENÜ) -->
    <div id="homeScreen" class="container">
        <h1> Randi </h1>
        <p style="color: #072f6b; margin-bottom: 40px;">Lass den Zufall entscheiden :</p>
        
        <button id="navToWheelBtn" class="menu-btn">🎯 Drehrad </button>
        <button id="navToFingerBtn" class="menu-btn" style="background-color: #d9660e; margin-top: 15px;">🖐️ Chooser</button>
    </div>

    <!-- 2. DREHRAD SCREEN (Standardmäßig versteckt) -->
    <div id="wheelScreen" class="container hidden">
        <!-- Zurück-Button -->
        <button class="back-btn" id="backFromWheelBtn">⬅️ Menü</button>
        
        <h1>🎯 Drehrad </h1>
        
        <div class="input-group">
            <input type="text" id="optionInput" placeholder="Option hinzufügen...">
            <button id="addBtn">✓</button>
        </div>

        <ul id="optionsListe"></ul>

        <!-- Canvas auf 340x340 vergrößert für das neue Gehäuse -->
        <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="340" height="340"></canvas>
        </div>

        <button id="drehBtn">Spin!</button>

        <div class="result-box" id="ergebnis">
            Füge Optionen hinzu!
        </div>
    </div>

    <!-- 3. FINGER AUSWAHL SCREEN (Standardmäßig versteckt) -->
    <div id="fingerScreen" class="container hidden">
        <button class="back-btn" id="backFromFingerBtn">⬅️ Menü</button>
        
        <h1>🖐️ Chooser</h1>
        <p style="color: #b96606; font-size: 14px; margin-bottom: 15px;">Lege 2 oder mehr Finger auf den Kreis!</p>

        <!-- Canvas auf 340x340 vergrößert für das neue Gehäuse -->
        <div class="wheel-box">
            <canvas id="fingerCanvas" width="340" height="340"></canvas>
        </div>

        <div class="result-box" id="fingerErgebnis">
            Warte auf Finger...
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
