<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Mein Premium Multi-Game</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Hilfsklasse zum Verstecken von Bildschirmen */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 1. HOME SCREEN (HAUPTMENÜ) -->
    <div id="homeScreen" class="container">
        <h1> Randi </h1>
        <p style="color: #718096; margin-bottom: 30px;">Wähle ein Spiel aus:</p>
        
        <button id="navToWheelBtn" class="menu-btn">🎯 Drehrad-Simulator</button>
        <button id="navToFingerBtn" class="menu-btn" style="background-color: #4bc0c0; margin-top: 15px;">🖐️ Finger-Auswahl</button>
    </div>

    <!-- 2. DREHRAD SCREEN (Standardmäßig versteckt) -->
    <div id="wheelScreen" class="container hidden">
        <!-- Zurück-Button -->
        <button class="back-btn" id="backFromWheelBtn">⬅️ Menü</button>
        
        <h1>🎯 Drehrad App</h1>
        
        <div class="input-group">
            <input type="text" id="optionInput" placeholder="Option hinzufügen...">
            <button id="addBtn">+</button>
        </div>

        <ul id="optionsListe"></ul>

        <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="300" height="300"></canvas>
        </div>

        <button id="drehBtn">DREHEN!</button>

        <div class="result-box" id="ergebnis">
            Füge Optionen hinzu!
        </div>
    </div>

    <!-- 3. FINGER AUSWAHL SCREEN (Standardmäßig versteckt) -->
    <div id="fingerScreen" class="container hidden">
        <button class="back-btn" id="backFromFingerBtn">⬅️ Menü</button>
        
        <h1>🖐️ Finger-Auswahl</h1>
        <p style="color: #718096; font-size: 14px; margin-bottom: 15px;">Lege 2 oder mehr Finger auf den Kreis!</p>

        <!-- Das interaktive Multi-Touch Feld -->
        <div class="wheel-box">
            <canvas id="fingerCanvas" width="300" height="300"></canvas>
        </div>

        <div class="result-box" id="fingerErgebnis">
            Warte auf Finger...
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
